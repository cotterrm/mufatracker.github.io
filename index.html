<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Ultimate Scoreboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --btn-bg: #334155;
      --team-a: #38bdf8;
      --team-b: #f59e0b;
      --badge-bg: #0369a1;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
      touch-action: manipulation;
    }
    .ratio-banner {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .ratio-meta {
      display: flex;
      flex-direction: column;
    }
    .ratio-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--subtext);
      font-weight: 700;
    }
    .point-indicator {
      font-size: 0.9rem;
      color: var(--text);
      font-weight: 600;
    }
    .ratio-code {
      font-size: 2.25rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 0.05em;
      line-height: 1;
    }
    .teams-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .team-card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .team-card.team-a { border-top: 4px solid var(--team-a); }
    .team-card.team-b { border-top: 4px solid var(--team-b); }
    .team-name {
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      background: transparent;
      color: var(--text);
      text-align: center;
      width: 100%;
      outline: none;
      margin-bottom: 0.25rem;
    }
    .score-val {
      font-size: 3.75rem;
      font-weight: 900;
      line-height: 1;
      margin: 0.5rem 0 0.75rem;
    }
    .score-btn {
      width: 100%;
      padding: 0.85rem 0;
      border: none;
      border-radius: 0.5rem;
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
    }
    .team-a .score-btn { background: #0284c7; }
    .team-a .score-btn:active { background: #0369a1; }
    .team-b .score-btn { background: #d97706; }
    .team-b .score-btn:active { background: #b45309; }

    .history-card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 0.75rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid #334155;
    }
    .history-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--subtext);
      font-weight: 700;
    }
    .undo-btn {
      background: transparent;
      border: 1px solid #475569;
      color: var(--subtext);
      border-radius: 0.35rem;
      padding: 0.2rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .undo-btn:active { background: #334155; }
    .history-list {
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      padding: 0.35rem 0.6rem;
      background: #0f172a;
      border-radius: 0.35rem;
    }
    .history-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .ratio-badge {
      background: #334155;
      color: #38bdf8;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      min-width: 2.25rem;
      text-align: center;
    }
    .tag-a { color: var(--team-a); font-weight: 700; }
    .tag-b { color: var(--team-b); font-weight: 700; }
    .history-score {
      font-weight: 800;
      color: #cbd5e1;
      font-variant-numeric: tabular-nums;
    }

    .footer-bar {
      margin-top: 0.75rem;
      display: flex;
      gap: 0.5rem;
    }
    .util-btn {
      flex: 1;
      padding: 0.6rem;
      background: transparent;
      border: 1px solid #475569;
      color: var(--subtext);
      border-radius: 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .util-btn:active { background: var(--card-bg); }
  </style>
</head>
<body>

  <header class="ratio-banner">
    <div class="ratio-meta">
      <span class="ratio-label">Current Ratio</span>
      <span class="point-indicator" id="current-point-label">Point 1</span>
    </div>
    <span class="ratio-code" id="ratio-text">F1</span>
  </header>

  <main class="teams-container">
    <section class="team-card team-a">
      <input class="team-name" id="name-a" value="Dark" onchange="saveState()" />
      <div class="score-val" id="score-a">0</div>
      <button class="score-btn" onclick="addGoal('a')">+1 Goal</button>
    </section>

    <section class="team-card team-b">
      <input class="team-name" id="name-b" value="White" onchange="saveState()" />
      <div class="score-val" id="score-b">0</div>
      <button class="score-btn" onclick="addGoal('b')">+1 Goal</button>
    </section>
  </main>

  <section class="history-card">
    <div class="history-header">
      <span class="history-title">Scoring Log</span>
      <button class="undo-btn" onclick="undoGoal()">Undo Last</button>
    </div>
    <div class="history-list" id="history-log"></div>
  </section>

  <footer class="footer-bar">
    <button class="util-btn" onclick="toggleStartGender()">Flip Start (F/M)</button>
    <button class="util-btn" onclick="resetGame()">Reset Match</button>
  </footer>

  <script>
    let state = {
      scoreA: 0,
      scoreB: 0,
      startGender: 'F',
      history: []
    };

    function getRatioCode(pointNumber, startGender) {
      if (pointNumber === 1) {
        return startGender === 'F' ? 'F1' : 'M1';
      }
      const pairIndex = Math.floor((pointNumber - 2) / 2);
      const isSecondInPair = (pointNumber - 2) % 2 === 1;

      const pairGender = (pairIndex % 2 === 0)
        ? (startGender === 'F' ? 'M' : 'F')
        : (startGender === 'F' ? 'F' : 'M');

      const pairNum = isSecondInPair ? '2' : '1';
      return pairGender + pairNum;
    }

    function render() {
      document.getElementById('score-a').innerText = state.scoreA;
      document.getElementById('score-b').innerText = state.scoreB;

      // Current point being played
      const currentPoint = state.scoreA + state.scoreB + 1;
      document.getElementById('current-point-label').innerText = `Point ${currentPoint}`;
      document.getElementById('ratio-text').innerText = getRatioCode(currentPoint, state.startGender);

      const logContainer = document.getElementById('history-log');
      logContainer.innerHTML = '';
      
      // Render reverse chronological so latest point is always on top
      for (let i = state.history.length - 1; i >= 0; i--) {
        const item = state.history[i];
        const teamName = item.team === 'a' 
          ? document.getElementById('name-a').value 
          : document.getElementById('name-b').value;
        const tagClass = item.team === 'a' ? 'tag-a' : 'tag-b';

        const row = document.createElement('div');
        row.className = 'history-row';
        row.innerHTML = `
          <div class="history-left">
            <span class="ratio-badge">${item.ratio}</span>
            <span>Pt ${item.point}: <span class="${tagClass}">${teamName}</span></span>
          </div>
          <span class="history-score">${item.scoreSnap}</span>
        `;
        logContainer.appendChild(row);
      }
    }

    function addGoal(team) {
      const activePoint = state.scoreA + state.scoreB + 1;
      const ratioDuringPoint = getRatioCode(activePoint, state.startGender);

      if (team === 'a') state.scoreA++;
      if (team === 'b') state.scoreB++;

      state.history.push({
        point: activePoint,
        team: team,
        ratio: ratioDuringPoint,
        scoreSnap: `${state.scoreA} - ${state.scoreB}`
      });

      saveState();
      render();
    }

    function undoGoal() {
      if (state.history.length === 0) return;
      const last = state.history.pop();
      if (last.team === 'a') state.scoreA = Math.max(0, state.scoreA - 1);
      if (last.team === 'b') state.scoreB = Math.max(0, state.scoreB - 1);
      saveState();
      render();
    }

    function toggleStartGender() {
      state.startGender = state.startGender === 'F' ? 'M' : 'F';
      saveState();
      render();
    }

    function resetGame() {
      if (!confirm("Reset match scores and history?")) return;
      state.scoreA = 0;
      state.scoreB = 0;
      state.history = [];
      saveState();
      render();
    }

    function saveState() {
      localStorage.setItem('ult_state', JSON.stringify({
        ...state,
        nameA: document.getElementById('name-a').value,
        nameB: document.getElementById('name-b').value
      }));
    }

    function loadState() {
      const saved = localStorage.getItem('ult_state');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state.scoreA = parsed.scoreA || 0;
          state.scoreB = parsed.scoreB || 0;
          state.startGender = parsed.startGender || 'F';
          state.history = parsed.history || [];
          if (parsed.nameA) document.getElementById('name-a').value = parsed.nameA;
          if (parsed.nameB) document.getElementById('name-b').value = parsed.nameB;
        } catch (e) {
          console.error(e);
        }
      }
      render();
    }

    loadState();
  </script>
</body>
</html>
