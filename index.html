<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Ultimate Scoreboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --btn-bg: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      touch-action: manipulation;
    }
    .ratio-banner {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 1rem;
      text-align: center;
      margin-bottom: 1rem;
    }
    .ratio-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--subtext);
    }
    .ratio-display {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      margin-top: 0.25rem;
    }
    .teams-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1;
    }
    .team-card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }
    .team-name {
      font-size: 1.25rem;
      font-weight: 700;
      border: none;
      background: transparent;
      color: var(--text);
      border-bottom: 1px dashed var(--subtext);
      padding-bottom: 0.25rem;
      outline: none;
      width: 100%;
    }
    .score-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin: 1rem 0;
    }
    .score-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: var(--btn-bg);
      color: var(--text);
      font-size: 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .score-btn:active {
      transform: scale(0.92);
      background: #475569;
    }
    .score-val {
      font-size: 4rem;
      font-weight: 900;
      min-width: 80px;
      text-align: center;
    }
    .tap-target {
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 0.75rem;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .tap-target:active {
      background: #0369a1;
    }
    .footer-bar {
      margin-top: 1rem;
      display: flex;
      gap: 0.75rem;
    }
    .sub-btn {
      flex: 1;
      padding: 0.75rem;
      background: transparent;
      border: 1px solid #475569;
      color: var(--subtext);
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .sub-btn:active {
      background: var(--card-bg);
    }
  </style>
</head>
<body>

  <header class="ratio-banner">
    <div class="ratio-title">Next Point Gender Ratio</div>
    <div class="ratio-display" id="ratio-text">4 Female / 3 Male</div>
  </header>

  <main class="teams-container">
    <section class="team-card">
      <input class="team-name" id="name-a" value="Dark" />
      <div class="score-area">
        <button class="score-btn" onclick="updateScore('a', -1)" aria-label="Decrease Dark Score">−</button>
        <span class="score-val" id="score-a">0</span>
        <button class="score-btn" onclick="updateScore('a', 1)" aria-label="Increase Dark Score">+</button>
      </div>
      <button class="tap-target" onclick="updateScore('a', 1)">+1 Dark Goal</button>
    </section>

    <section class="team-card">
      <input class="team-name" id="name-b" value="White" />
      <div class="score-area">
        <button class="score-btn" onclick="updateScore('b', -1)" aria-label="Decrease White Score">−</button>
        <span class="score-val" id="score-b">0</span>
        <button class="score-btn" onclick="updateScore('b', 1)" aria-label="Increase White Score">+</button>
      </div>
      <button class="tap-target" onclick="updateScore('b', 1)">+1 White Goal</button>
    </section>
  </main>

  <footer class="footer-bar">
    <button class="sub-btn" onclick="toggleStartingRatio()">Flip Starting Ratio</button>
    <button class="sub-btn" onclick="resetGame()">Reset Game</button>
  </footer>

  <script>
    let scoreA = 0;
    let scoreB = 0;
    let startRatio = 0; // 0 = 4F/3M first, 1 = 4M/3F first

    function getRatio(totalPoints, start) {
      // Standard WFDF Ratio Rule A / USAU Prescribed:
      // Point 1: Initial ratio
      // Points 2 & 3: Inverted ratio
      // Points 4 & 5: Initial ratio, etc.
      // (Total points played determines who is on the field for point `totalPoints + 1`)
      const cycleIndex = Math.floor((totalPoints + 1) / 2) % 2;
      const effectiveState = (start + cycleIndex) % 2;
      return effectiveState === 0 ? "4 Female / 3 Male" : "4 Male / 3 Female";
    }

    function render() {
      document.getElementById('score-a').innerText = scoreA;
      document.getElementById('score-b').innerText = scoreB;
      document.getElementById('ratio-text').innerText = getRatio(scoreA + scoreB, startRatio);
    }

    function updateScore(team, delta) {
      if (team === 'a') scoreA = Math.max(0, scoreA + delta);
      if (team === 'b') scoreB = Math.max(0, scoreB + delta);
      render();
    }

    function toggleStartingRatio() {
      startRatio = startRatio === 0 ? 1 : 0;
      render();
    }

    function resetGame() {
      if (confirm("Reset scores to 0?")) {
        scoreA = 0;
        scoreB = 0;
        render();
      }
    }

    render();
  </script>
</body>
</html>
